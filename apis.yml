aid: the-climate-corporation
name: The Climate Corporation
description: >-
  The Climate Corporation (Climate LLC, a Bayer company) operates Climate
  FieldView, one of the world's largest digital agriculture platforms, spanning
  120M+ acres and 100,000+ farmers. Its FieldView Platform APIs let approved
  partners read and write growers' data with OAuth2 consent: field boundaries
  (GeoJSON), farm organizations, operations, resource owners, and agronomic
  layers (as-planted, as-applied, as-harvested, scouting), plus asynchronous
  bulk uploads and exports of planting, application, harvest, imagery, seeding
  prescription (rx), and soil-sample data. Every call requires both a Bearer
  access token and a partner X-Api-Key. A v5 API surface is in preview.
